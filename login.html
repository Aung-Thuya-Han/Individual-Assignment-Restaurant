<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in or register for Student Restaurants.">
    <title>Log in - Student Restaurants</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
  </head>

  <body>
    <header class="site-header">
      <div class="container header-content">
        <a class="brand" href="indivi_assignment.html" aria-label="Student Restaurants home">
          <span class="brand-mark" aria-hidden="true">SR</span>
          <span>Student Restaurants</span>
        </a>

        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li><a href="indivi_assignment.html#restaurants">Restaurants</a></li>
            <li><a href="indivi_assignment.html#about">About</a></li>
            <li><a class="current-nav-link" href="login.html">Log in</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="account-page">
      <div class="container account-container">
        <div class="account-introduction">
          <p class="eyebrow">Your account</p>
          <h1>Welcome to Student Restaurants</h1>
          <p>Log in to manage your profile. New users can create an account.</p>
        </div>

        <section class="account-card" aria-labelledby="account-form-title">
          <div class="account-switcher" aria-label="Choose account form">
            <button class="account-tab active-button" id="show-login" type="button">Log in</button>
            <button class="account-tab" id="show-register" type="button">Register</button>
          </div>

          <div id="login-section">
            <h2 id="account-form-title">Log in</h2>
            <form id="login-form">
              <label for="login-username">Username</label>
              <input id="login-username" name="username" type="text" autocomplete="username" required>

              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" required>

              <button class="form-button" type="submit">Log in</button>
            </form>
            <p class="form-status" id="login-status" role="status"></p>
          </div>

          <div id="register-section" hidden>
            <h2>Create an account</h2>
            <form id="register-form">
              <label for="register-username">Username</label>
              <input id="register-username" name="username" type="text" autocomplete="username" minlength="3" required>

              <label for="register-email">Email</label>
              <input id="register-email" name="email" type="email" autocomplete="email" required>

              <label for="register-password">Password</label>
              <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>

              <button class="form-button" type="submit">Register</button>
            </form>
            <div class="form-status" id="register-status" role="status"></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
